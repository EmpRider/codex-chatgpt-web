name: Apply MCP Context Read Type Fix

on:
  push:
    branches:
      - fix/mcp-context-read-safety-work

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/mcp-context-read-safety-work
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Apply strict narrowing cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/adapters/chatgpt-web/mcp-server.ts",
              '        if (contract === "native"\n'
              '          && reservedContextQuery\n'
              '          && query?.trim() === reservedContextQuery) {\n',
              '        if (contract === "native"\n'
              '          && contextTransport\n'
              '          && reservedContextQuery\n'
              '          && query?.trim() === reservedContextQuery) {\n',
          )

          replace_once(
              "src/adapters/chatgpt-web/prompt.ts",
              '  CHATGPT_WEB_MCP_CONTEXT_MIN_CHARS,\n  CHATGPT_WEB_MCP_CONTEXT_READ_WIRE_NAME,\n  chatGptWebMcpContextChunks,\n',
              '  CHATGPT_WEB_MCP_CONTEXT_MIN_CHARS,\n  chatGptWebMcpContextChunks,\n',
          )
          PY
      - name: Verify strict typecheck and focused regression
        run: |
          bun run typecheck
          bun test tests/mcp-context-read-safety.test.ts tests/mcp-context-transport.test.ts
      - name: Commit verified fix
        shell: bash
        run: |
          git rm .github/workflows/apply-mcp-context-read-type-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/adapters/chatgpt-web/mcp-server.ts src/adapters/chatgpt-web/prompt.ts
          git commit -m "fix: narrow read-only context transport safely"
          git push origin HEAD:fix/mcp-context-read-safety-work
