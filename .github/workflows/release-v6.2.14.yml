name: Release v6.2.14

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/release-v6.2.14.yml"

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Synchronize version to 6.2.14
        shell: bash
        run: |
          files=(
            package.json
            launcher/package.json
            src/version.ts
            scripts/install.sh
            README.md
            README.zh-CN.md
            README.ja.md
            README.ko.md
          )
          for file in "${files[@]}"; do
            sed -i 's/6\.2\.13/6.2.14/g' "$file"
          done
          bun run check-version
          git diff --check
      - name: Commit, tag, and dispatch release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-v6.2.14.yml
          git add package.json launcher/package.json src/version.ts scripts/install.sh \
            README.md README.zh-CN.md README.ja.md README.ko.md
          git commit -m "chore: release v6.2.14"
          git push origin HEAD:main
          git tag v6.2.14 HEAD
          git push origin refs/tags/v6.2.14
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref v6.2.14
