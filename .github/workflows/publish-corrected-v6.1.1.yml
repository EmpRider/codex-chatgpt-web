name: Publish corrected v6.1.1

on:
  push:
    branches:
      - release/v6.1.1-compaction-fix

permissions:
  contents: write
  actions: write

jobs:
  retag-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Move v6.1.1 to merged compaction fix
        env:
          TARGET_SHA: 1faa4ae504a680b79835db8fb4902837b6ac2cd5
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v6.1.1 "$TARGET_SHA"
          git push --force origin refs/tags/v6.1.1
      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref v6.1.1
