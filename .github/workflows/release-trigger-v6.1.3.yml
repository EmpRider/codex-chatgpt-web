name: One-shot release tag v6.1.3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-trigger-v6.1.3.yml"

permissions:
  actions: write
  contents: write

jobs:
  create-tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure v6.1.3 tag points at the validated release commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 23fc0ad0db46d70bc3c13bf31f45990046530627
          RELEASE_TAG: v6.1.3
        run: |
          set -euo pipefail
          ref="repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG"
          if existing="$(gh api "$ref" --jq '.object.sha' 2>/dev/null)"; then
            test "$existing" = "$TARGET_SHA"
            echo "$RELEASE_TAG already points to $TARGET_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$TARGET_SHA"
            echo "Created $RELEASE_TAG -> $TARGET_SHA"
          fi

      - name: Dispatch the release workflow for v6.1.3
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v6.1.3
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"
