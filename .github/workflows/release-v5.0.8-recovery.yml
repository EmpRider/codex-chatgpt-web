name: Release v5.0.8 Recovery

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/release-v5.0.8-recovery.yml"]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.commit.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply approved release fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # The failing release run showed these deterministic CPU-heavy tests completing
          # successfully but exceeding their old wall-clock limits on slower hosted runners.
          replace_once(
              "tests/browser-worker-contract.test.ts",
              '\n}, 20_000);\n\ntest("Bigger Context preflight expands only the total context ceiling and keeps each message boundary"',
              '\n}, 90_000);\n\ntest("Bigger Context preflight expands only the total context ceiling and keeps each message boundary"',
          )
          replace_once(
              "tests/chatgpt-web-usage.test.ts",
              '\n}, 30_000);\n\ntest("Bigger Context compaction selects three parts before the legacy inline byte budget"',
              '\n}, 90_000);\n\ntest("Bigger Context compaction selects three parts before the legacy inline byte budget"',
          )
          replace_once(
              "tests/prompt-contract.test.ts",
              '\n});\n\ntest("Bigger Context minimizes the largest ordered stage instead of overfilling a middle part"',
              '\n}, 20_000);\n\ntest("Bigger Context minimizes the largest ordered stage instead of overfilling a middle part"',
          )

          # Keep every release-version authority synchronized.
          replace_once("package.json", '"version": "5.0.7"', '"version": "5.0.8"')
          replace_once("launcher/package.json", '"version": "5.0.7"', '"version": "5.0.8"')
          replace_once("src/version.ts", 'export const VERSION = "5.0.7";', 'export const VERSION = "5.0.8";')
          replace_once(
              "scripts/install.sh",
              'VERSION="${CODEX_CHATGPT_WEB_VERSION:-5.0.7}"',
              'VERSION="${CODEX_CHATGPT_WEB_VERSION:-5.0.8}"',
          )
          PY
          rm .github/workflows/release-v5.0.8-recovery.yml
          git diff --check
          git diff -- tests/browser-worker-contract.test.ts tests/chatgpt-web-usage.test.ts tests/prompt-contract.test.ts package.json launcher/package.json src/version.ts scripts/install.sh
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Verify patched source before committing
        run: bun run verify
      - name: Commit verified recovery source
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize release verification and bump v5.0.8"
          git push origin HEAD:main
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            runtime_asset: codex-chatgpt-web-darwin-arm64.tar.gz
          - runner: macos-15-intel
            runtime_asset: codex-chatgpt-web-darwin-amd64.tar.gz
          - runner: ubuntu-latest
            runtime_asset: codex-chatgpt-web-linux-amd64.tar.gz
          - runner: windows-latest
            runtime_asset: codex-chatgpt-web-windows-amd64.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Prepare AVX2-independent Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-windows-baseline-bun.ps1 -Version 1.4.0 -GitHubEnv $env:GITHUB_ENV
      - name: Prepare compatible Linux libnotify
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config libglib2.0-dev libgdk-pixbuf-2.0-dev binutils
          ./scripts/prepare-linux-libnotify.sh
      - name: Prepare owned AppImage toolset
        if: runner.os == 'Linux'
        run: bun run launcher/scripts/prepare-linux-appimage-tools.cjs
      - run: bun run verify
      - run: bun run app:package
      - name: Verify Linux AppImage ABI on current Arch
        if: runner.os == 'Linux'
        run: |
          artifact="$(find launcher/artifacts -maxdepth 1 -name '*-linux-x64.AppImage' -print -quit)"
          test -n "$artifact"
          docker run --rm -v "$PWD:/work:ro" -e APPIMAGE_PATH="/work/$artifact" archlinux:base \
            sh -lc 'pacman -Sy --noconfirm binutils file glibc alsa-lib at-spi2-core cairo cups gtk3 libx11 libxcb libxcomposite libxdamage libxext libxfixes libxkbcommon libxrandr mesa nspr nss pango >/dev/null && /work/launcher/scripts/smoke-linux-appimage-symbols.sh "$APPIMAGE_PATH"'
      - name: Ensure virtual display is available
        if: runner.os == 'Linux'
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - run: bun run app:smoke
      - name: Verify embedded macOS runtime signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict launcher/build/runtime/runtime/bun
      - name: Verify packaged macOS application signature
        if: runner.os == 'macOS'
        run: |
          archive="$(find launcher/artifacts -maxdepth 1 -name '*-mac-*.zip' -print -quit)"
          test -n "$archive"
          stage="$(mktemp -d)"
          ditto -x -k "$archive" "$stage"
          codesign --verify --deep --strict --verbose=2 "$stage/Codex Web GPT.app"
      - name: Archive runtime
        if: runner.os != 'Windows'
        run: tar -czf "${{ matrix.runtime_asset }}" -C launcher/build/runtime .
      - name: Archive Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path launcher/build/runtime/* -DestinationPath "${{ matrix.runtime_asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.runner }}
          path: |
            ${{ matrix.runtime_asset }}
            launcher/artifacts/*.dmg
            launcher/artifacts/*.zip
            launcher/artifacts/*.exe
            launcher/artifacts/*.AppImage
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v5.0.8
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - run: bun run licenses
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify release version and tag availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(jq -r .version package.json)" = "5.0.8"
          test "$(cat src/version.ts)" = 'export const VERSION = "5.0.8";'
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG tag already exists" >&2
            exit 1
          fi
      - name: Add licenses and installers
        run: |
          cp LICENSE release-assets/LICENSE
          cp LICENSES/Bun-1.4.0.md release-assets/Bun-1.4.0.md
          cp LICENSES/libnotify-0.8.7-LGPL-2.1.md release-assets/libnotify-0.8.7-LGPL-2.1.md
          cp dist/THIRD_PARTY_NOTICES.txt release-assets/THIRD_PARTY_NOTICES.txt
          cp scripts/install.sh release-assets/install.sh
          cp scripts/install-launcher.sh release-assets/install-launcher.sh
          cp scripts/install-launcher.ps1 release-assets/install-launcher.ps1
      - name: Flatten release assets
        run: |
          cd release-assets
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            if [ -e "$name" ]; then
              echo "Duplicate release asset name: $name" >&2
              exit 1
            fi
            mv "$file" "$name"
          done < <(find . -mindepth 2 -type f -print0 | sort -z)
          find . -mindepth 1 -type d -empty -delete
      - name: Create checksums
        run: |
          cd release-assets
          checksum_file="$(mktemp)"
          find . -maxdepth 1 -type f ! -name checksums.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > "$checksum_file"
          mv "$checksum_file" checksums.txt
      - name: Verify every built asset is checksummed
        run: |
          cd release-assets
          missing=""
          while IFS= read -r -d '' file; do
            name="${file#./}"
            if [ "$name" = checksums.txt ]; then continue; fi
            if ! awk -v asset="$name" '$2 == asset { found = 1 } END { exit found ? 0 : 1 }' checksums.txt; then
              missing="$missing $name"
            fi
          done < <(find . -type f -print0)
          if [ -n "$missing" ]; then
            echo "checksums.txt is missing entries for:$missing" >&2
            exit 1
          fi
      - name: Publish v5.0.8 and verify remote digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' release_files < <(find release-assets -type f -print0)
          test "${#release_files[@]}" -gt 0
          gh release create "$RELEASE_TAG" "${release_files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "$RELEASE_TAG" \
            --latest \
            --generate-notes

          published_manifest="$(mktemp)"
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[] | select(.name != "checksums.txt") | [.name, .digest] | @tsv' \
            | while IFS=$'\t' read -r name digest; do
                if [[ "$digest" != sha256:* || -z "${digest#sha256:}" ]]; then
                  echo "Published asset has no SHA-256 digest: $name" >&2
                  exit 1
                fi
                printf '%s  %s\n' "${digest#sha256:}" "$name"
              done \
            | LC_ALL=C sort -k2 > "$published_manifest"
          test -s "$published_manifest"
          mv "$published_manifest" release-assets/checksums.txt
          gh release upload "$RELEASE_TAG" release-assets/checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          while IFS=$'\t' read -r name digest; do
            if [ "$name" = checksums.txt ]; then continue; fi
            expected="$(awk -v asset="$name" '$2 == asset { print $1 }' release-assets/checksums.txt)"
            if [ -z "$expected" ] || [ "sha256:$expected" != "$digest" ]; then
              echo "Published asset checksum mismatch: $name" >&2
              exit 1
            fi
          done < <(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[] | [.name, .digest] | @tsv')

          local_manifest_digest="$(sha256sum release-assets/checksums.txt | awk '{ print $1 }')"
          remote_manifest_digest="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[] | select(.name == "checksums.txt") | .digest')"
          test "sha256:$local_manifest_digest" = "$remote_manifest_digest"
