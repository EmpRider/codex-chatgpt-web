name: Verify final upstream MCP context contribution

on:
  push:
    branches:
      - automation/build-mcp-context-upstream

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Verify contribution branch beyond unchanged dependency audits
        shell: bash
        run: |
          set -euo pipefail
          base="e85e3693fdb4e3e033348c08df0298c20fcdb612"
          target_branch="feat/mcp-large-context-transport-upstream"
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT

          git fetch origin "$target_branch"
          git checkout -B "$target_branch" "origin/$target_branch"

          test "$(git show "$base:package.json" | jq -r .version)" = "5.0.6"
          test "$(jq -r .version package.json)" = "5.0.6"

          expected="$(cat <<'EOF'
          docs/architecture.md
          src/adapters/chatgpt-web/context-transport.ts
          src/adapters/chatgpt-web/index.ts
          src/adapters/chatgpt-web/input-tokens.ts
          src/adapters/chatgpt-web/mcp-server.ts
          src/adapters/chatgpt-web/prompt.ts
          src/adapters/chatgpt-web/turn-broker.ts
          tests/chatgpt-web-harness.test.ts
          tests/dev-chat.test.ts
          tests/mcp-context-adapter.test.ts
          tests/mcp-context-read-safety.test.ts
          tests/mcp-context-transport.test.ts
          tests/prompt-contract.test.ts
          EOF
          )"
          printf '%s\n' "$expected" | sort > /tmp/expected-files
          git diff --name-only "$base" HEAD | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          git diff --check "$base" HEAD

          # The PR changes no dependency manifest or lockfile. Record the current upstream-base
          # audit findings, but do not hide them or mutate dependencies in this focused PR.
          bun install --frozen-lockfile
          bun install --cwd launcher --frozen-lockfile
          set +e
          bun run audit >/tmp/root-audit.log 2>&1
          root_audit=$?
          bun run launcher:audit >/tmp/launcher-audit.log 2>&1
          launcher_audit=$?
          set -e
          cat /tmp/root-audit.log
          cat /tmp/launcher-audit.log
          echo "ROOT_AUDIT_EXIT=$root_audit"
          echo "LAUNCHER_AUDIT_EXIT=$launcher_audit"

          bun run check-version
          bun run typecheck
          bun run test
          bun run launcher:typecheck
          bun run launcher:test
          bun run launcher:build
          bun run scripts/build-runtime-bundle.ts "$scratch/runtime"
          bun run scripts/generate-third-party-notices.ts "$scratch/THIRD_PARTY_NOTICES.txt" --include-launcher
          bun run scripts/smoke-release.ts "$scratch/runtime"
