name: Start v5.0.12 release
on:
  push:
    branches: [main]
    paths: [".github/workflows/start-v5.0.12-release.yml"]
permissions:
  contents: write
  actions: write
jobs:
  release:
    if: >-
      github.event.head_commit.message == 'chore: release v5.0.12'
    runs-on: ubuntu-latest
    steps:
      - name: Tag release commit and dispatch release build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          gh api "repos/$GH_REPO/git/refs" -f ref=refs/tags/v5.0.12 -f sha="$RELEASE_SHA"
          gh workflow run release.yml --repo "$GH_REPO" --ref v5.0.12
