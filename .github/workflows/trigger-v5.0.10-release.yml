name: Trigger v5.0.10 Release

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/trigger-v5.0.10-release.yml"

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create release tag on verified merge commit
        shell: bash
        run: |
          set -euo pipefail
          target="32f2ed377c09af1936b8d35fd55274a10ab3c18b"
          git cat-file -e "$target^{commit}"
          test "$(git show "$target:package.json" | jq -r .version)" = "5.0.10"
          if git ls-remote --exit-code --tags origin refs/tags/v5.0.10 >/dev/null 2>&1; then
            remote_target="$(git ls-remote origin refs/tags/v5.0.10 | awk '{print $1}')"
            test "$remote_target" = "$target"
          else
            git tag v5.0.10 "$target"
            git push origin refs/tags/v5.0.10
          fi
      - name: Dispatch release workflow on tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref v5.0.10
