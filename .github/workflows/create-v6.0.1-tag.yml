name: Create v6.0.1 release tag

on:
  push:
    branches:
      - release/v6.0.1-trigger

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create v6.0.1 tag at merged hotfix
        env:
          TARGET_SHA: be2d9d2baad9350e287a408507bfa7dbebf52c95
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v6.0.1 >/dev/null 2>&1; then
            echo "v6.0.1 already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag v6.0.1 "$TARGET_SHA"
          git push origin refs/tags/v6.0.1
