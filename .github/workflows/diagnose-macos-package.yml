name: Diagnose macOS Package

on:
  push:
    branches: [feat/mcp-context-transport]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Capture package output
        shell: bash
        run: |
          set -o pipefail
          {
            echo "uname: $(uname -a)"
            echo "root version: $(node -p 'require(\"./package.json\").version')"
            echo "launcher version: $(node -p 'require(\"./launcher/package.json\").version')"
            bun run app:package
          } 2>&1 | tee macos-package-diagnostic.log
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-package-diagnostic
          path: macos-package-diagnostic.log
          if-no-files-found: error
