name: Apply MCP Context Transport

on:
  push:
    branches: [feat/mcp-context-transport]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/mcp-context-transport
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Apply staged implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_mcp_context_transport.py')
          text = path.read_text()
          text = text.replace('if count != 1:', 'if count < 1:', 1)
          path.write_text(text)
          PY
          python3 scripts/apply_mcp_context_transport.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/prompt-contract.test.ts')
          text = path.read_text()
          old = '''test("keeps large contexts intact in the inline text envelope", () => {
            const token = "turn_12345678901234567890123456789012";
            const largeContent = "x".repeat(600_000);
            const large = request("high");
            large.context.messages.push({
              role: "toolResult",
              toolCallId: "call_large",
              toolName: "exec_command",
              content: largeContent,
              isError: false,
              timestamp: 3,
            });
            const compiled = compileChatGptWebPrompt(
              large,
              { localToolsEnabled: true, solAvailable: true, proAvailable: true },
              token,
            );

            expect(compiled.text.length).toBeGreaterThan(600_000);
            expect(compiled.text).toContain(largeContent);
            expect(compiled.text).toContain(token);
            expect(compiled.text).toContain(`<codex_context_json>`);
            expect(compiled.text).not.toContain(`<codex_context_attachment>`);
            expect(compiled.text).not.toContain("sha256");
            expect(compiled.text).not.toContain("SHA-256");
          });'''
          new = '''test("keeps large Full-mode contexts exact while moving them out of the visible composer", () => {
            const token = "turn_12345678901234567890123456789012";
            const largeContent = "x".repeat(600_000);
            const large = request("high");
            large.context.messages.push({
              role: "toolResult",
              toolCallId: "call_large",
              toolName: "exec_command",
              content: largeContent,
              isError: false,
              timestamp: 3,
            });
            const compiled = compileChatGptWebPrompt(
              large,
              { localToolsEnabled: true, solAvailable: true, proAvailable: true },
              token,
            );

            expect(compiled.contextTransport).toBeDefined();
            expect(compiled.contextTransport!.text).toContain(largeContent);
            expect(compiled.text.length).toBeLessThan(10_000);
            expect(compiled.text).not.toContain(largeContent);
            expect(compiled.text).toContain(token);
            expect(compiled.text).toContain("codex_web_context_read");
            expect(compiled.text).toContain(compiled.contextTransport!.contextId);
            expect(compiled.text).toContain(compiled.contextTransport!.sha256);
            expect(compiled.text).not.toContain(`<codex_context_json>`);
            expect(compiled.text).not.toContain(`<codex_context_attachment>`);
          });'''
          if old not in text:
              raise SystemExit('legacy large-context test block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: bun run typecheck
      - run: bun test tests/mcp-context-transport.test.ts
      - run: bun test tests/prompt-contract.test.ts tests/turn-broker-lifecycle.test.ts tests/zero-risk-mcp-lifecycle.test.ts
      - run: git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply_mcp_context_transport.py .github/workflows/apply-mcp-context-transport.yml
          git add src/adapters/chatgpt-web/context-transport.ts \
                  src/adapters/chatgpt-web/prompt.ts \
                  src/adapters/chatgpt-web/turn-broker.ts \
                  src/adapters/chatgpt-web/mcp-server.ts \
                  src/adapters/chatgpt-web/index.ts \
                  tests/prompt-contract.test.ts \
                  docs/architecture.md
          git commit -m "feat: add MCP context transport for large Full-mode prompts"
          git push origin HEAD:feat/mcp-context-transport
